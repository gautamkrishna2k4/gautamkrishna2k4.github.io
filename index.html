<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gautam Krishna R — Portfolio</title>
    <meta name="description"
        content="Portfolio of Gautam Krishna R — Full-Stack Developer, Open Source Enthusiast, and Creative Problem Solver." />
    <meta property="og:title" content="Gautam Krishna R — Portfolio" />
    <meta property="og:description" content="Full-Stack Developer crafting elegant digital experiences." />
    <meta property="og:type" content="website" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet" />

    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- ─── Cursor Glow ─────────────────────────────────────── -->
    <div id="cursor-glow" class="cursor-glow" aria-hidden="true"></div>

    <!-- ─── Particles Canvas ────────────────────────────────── -->
    <canvas id="particles" class="particles-canvas" aria-hidden="true"></canvas>

    <!-- ─── Navigation ──────────────────────────────────────── -->
    <nav id="navbar" class="navbar">
        <a href="#hero" class="nav-logo" id="nav-logo"></a>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
        <ul class="nav-links" id="nav-links">
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#contact">Contact</a></li>
            <li>
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
                    <i data-lucide="sun" class="theme-icon sun-icon"></i>
                    <i data-lucide="moon" class="theme-icon moon-icon"></i>
                </button>
            </li>
        </ul>
    </nav>

    <!-- ─── Hero ────────────────────────────────────────────── -->
    <section id="hero" class="hero">
        <div class="hero-content">
            <p class="hero-greeting">Hello, I'm</p>
            <h1 class="hero-name" id="hero-name"></h1>
            <div class="hero-tagline-wrapper">
                <span class="hero-tagline-prefix">&gt;&nbsp;</span>
                <span class="hero-tagline" id="hero-tagline"></span>
                <span class="cursor-blink">|</span>
            </div>
            <p class="hero-subtext" id="hero-subtext"></p>
            <div class="hero-cta">
                <a href="#projects" class="btn btn-primary">View My Work</a>
                <a href="#contact" class="btn btn-outline">Get In Touch</a>
            </div>
        </div>
        <div class="scroll-indicator" aria-hidden="true">
            <div class="scroll-mouse">
                <div class="scroll-wheel"></div>
            </div>
            <p>Scroll Down</p>
        </div>
    </section>

    <!-- ─── About ───────────────────────────────────────────── -->
    <section id="about" class="section about">
        <div class="container">
            <h2 class="section-title reveal">
                <span class="section-number">01.</span> About Me
            </h2>
            <div class="about-grid reveal">
                <div class="about-text" id="about-text"></div>
                <div class="about-stats" id="about-stats"></div>
            </div>
        </div>
    </section>

    <!-- ─── Skills ──────────────────────────────────────────── -->
    <section id="skills" class="section skills">
        <div class="container">
            <h2 class="section-title reveal">
                <span class="section-number">02.</span> Skills & Tech
            </h2>
            <div class="skills-grid" id="skills-grid"></div>
        </div>
    </section>


    <!-- ─── Contact ─────────────────────────────────────────── -->
    <section id="contact" class="section contact">
        <div class="container">
            <h2 class="section-title reveal">
                <span class="section-number">03.</span> Contact
            </h2>
            <div class="contact-content reveal">
                <div class="contact-info" id="contact-info"></div>
                <form class="contact-form" id="contact-form">
                    <div class="form-group">
                        <input type="text" id="form-name" placeholder=" " required />
                        <label for="form-name">Your Name</label>
                    </div>
                    <div class="form-group">
                        <input type="email" id="form-email" placeholder=" " required />
                        <label for="form-email">Your Email</label>
                    </div>
                    <div class="form-group">
                        <textarea id="form-message" rows="5" placeholder=" " required></textarea>
                        <label for="form-message">Your Message</label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">
                        <i data-lucide="send" style="width:18px;height:18px"></i>
                        Send Message
                    </button>
                </form>
            </div>
        </div>
    </section>

    <!-- ─── Footer ──────────────────────────────────────────── -->
    <footer class="footer">
        <p>Designed & Built by <strong id="footer-name"></strong></p>
        <p class="footer-year"></p>
    </footer>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
